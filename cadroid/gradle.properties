# Gradle 构建配置（Gradle 与 Android Studio 都会读取本文件）
#
# 这里只放「与机器无关」的设置；本机专属的东西请放 ~/.gradle/gradle.properties，例如：
#   org.gradle.java.home=/path/to/jdk      （指定构建用 JDK）
#   systemProp.http.proxyHost=...          （代理）
# 这样换台机器 clone 下来不会因为路径不存在而构建失败。

# 守护进程 JVM：AGP 8 + R8 精简（工程里含优量汇等较大 SDK）比较吃内存；
# 固定 UTF-8 可避免在 GBK 环境下源码/中文资源被 javac 按错误编码读取。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 以下两项只影响构建速度，不影响产物内容：
# 并行执行任务
# org.gradle.parallel=true
# 复用本地构建缓存（~/.gradle/caches/build-cache-1）
# org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
# org.gradle.tooling.parallel=true

# AndroidX：老 support 库已全部迁走（源码只剩 4 个注解 import）
android.useAndroidX=true
# Jetifier：TalkingData 的 jar 是半迁移状态的第三方 SDK，内部引用
#   android/support/v4/app/Fragment、FragmentActivity
#   android/support/v4/view/ViewPager、ViewPager$OnPageChangeListener
#   android/support/v7/widget/RecyclerView
# 这些类我们项目里一个都没有，但 TD 的类本身不会被裁掉，运行时走到就 NoClassDefFoundError。
# 实测：带 jetifier 的 dex 里 android/support 引用为 0；去掉后引用重新出现。
#
# 试过把它做成"有 TD jar 才开启"的条件（build.gradle 里 ext['android.enableJetifier']），
# 无效 —— AGP 在应用插件时就从 gradle.properties/命令行读取该属性，
# 那时 build.gradle 还没执行。所以只能写死在这里。
# AGP 10 会移除该开关，届时只能等 TD 迁移或弃用 TD。
android.enableJetifier=true
