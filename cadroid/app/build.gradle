apply plugin: 'com.android.application'

// CHelper 内核资源（.so / cpack）不入库，本地缺失时构建直接报错，避免悄悄缺失
tasks.register("checkCHelperAssets") {
    // 没有输入输出，必须禁用 up-to-date 检查，否则 doFirst 会被跳过
    outputs.upToDateWhen { false }
    doFirst {
        def missing = []
        if (!file("src/main/jniLibs/arm64-v8a/libCHelperAndroid.so").exists()) {
            missing << "jniLibs/arm64-v8a/libCHelperAndroid.so"
        }
        ["cpack", "old2new", "rawtext"].each { name ->
            if (!file("src/main/assets/$name").exists()) {
                missing << "assets/$name"
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "缺少 CHelper 内核资源，请先准备：\n  " + missing.join("\n  ") +
                "\n\n步骤：\n" +
                "  1. cd CHelper && python scripts/build_android_core.py\n" +
                "  2. 复制 CHelper-Android/app/libs/arm64-v8a/libCHelperAndroid.so\n" +
                "     -> cadroid/app/src/main/jniLibs/arm64-v8a/\n" +
                "  3. 复制 CHelper-Android/app/src/main/assets/{cpack,old2new,rawtext}\n" +
                "     -> cadroid/app/src/main/assets/\n" +
                "（如果暂时不接 CHelper 引擎，可临时注释掉 checkCHelperAssets 依赖）"
            )
        }
    }
}

preBuild.dependsOn checkCHelperAssets

android {
    namespace 'com.huangyx.ca'
    compileSdkVersion 32

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId "com.huangyx.ca"
        minSdkVersion 19
        targetSdkVersion 32
        versionCode 20659
        versionName "0.2.0"
        buildConfigField "int", "SHELL_VERSION", "26"
        multiDexEnabled true
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
    // implementation files('libs/SaaS_TalkingDataSDK_Android_V5.0.9.jar')
    implementation 'com.android.support:support-annotations:28.0.0'
    // Rhino 1.7.15.1（Android 最新可用版本，1.8+ 因 JPMS 不兼容 Android）
    implementation 'org.mozilla:rhino:1.7.15.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.2'
    implementation 'com.jakewharton.android.repackaged:dalvik-dx:11.0.0_r3'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'

    //GDT SDK require
    //noinspection GradleCompatible
    //implementation 'com.android.support:support-v4:28.0.0'
}
