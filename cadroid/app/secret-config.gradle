// 密钥/账号配置的逐条合并逻辑（由 app/build.gradle 通过 apply from 引入）。
//
// 三份候选文件（都在 src/main/java/com/xero/ca/config/ 下）：
//   1. local/Secret.java      本机私人配置（.gitignore 忽略，可选）
//   2. standard/Secret.java   默认配置（原作者公开的那份值）
//   3. template/Secret.java   模板（全空，兜底）
//
// 合并规则是「逐条」而不是整份：
//   对每一个 getXxx()，按 私人 -> 默认 -> 模板 的顺序找第一个「非空」的值；
//   某一条在私人文件里是空的，就单独回退到默认的对应值，不影响其它条目；
//   三条都空就用空字符串（= 该功能关闭）。
//
// 支持的写法（模板就是这么写的，自己写私人配置时也请保持）：
//   public static String getXxx() { return "字面量"; }
//   public static String getXxx() { return CONST; }              // CONST 为本文件里的 private static final String
//   public static byte[] getVerifyKey() { return Base64.decode(CONST, Base64.DEFAULT); }
//
// 生成结果：build/generated/source/secret/com/xero/ca/gen/Secret.java
// （放在 gen 包下，避免和私人文件名 com/xero/ca/Secret.java 抢同一个类名）

def secretStages = [
        [name: 'local（本机）', file: file('src/main/java/com/xero/ca/config/local/Secret.java')],
        [name: 'standard（默认）', file: file('src/main/java/com/xero/ca/config/standard/Secret.java')],
        [name: 'template（模板）', file: file('src/main/java/com/xero/ca/config/template/Secret.java')],
]

// 解析一份配置源文件：返回 [getterName: [type: 'String'|'byte[]', value: '...']]
def parseSecretSource = { File f ->
    def src = f.text
    def consts = [:]
    // 收集本文件里的字符串常量
    // 支持单行与「多行字符串拼接」，例如 HOTFIX_PUBLIC_KEY = "..." + "..." + "...";
    (src =~ /(?s)private\s+static\s+final\s+String\s+(\w+)\s*=\s*(.+?);/).each { m ->
        def parts = []
        (m[2] =~ /"((?:[^"\\]|\\.)*)"/).each { lit -> parts << lit[1] }
        consts[m[1]] = parts.join('')
    }
    def values = [:]
    def matcher = src =~ /(?s)public\s+static\s+(String|byte\[\])\s+(\w+)\s*\(\s*\)\s*\{\s*return\s+(.+?);\s*\}/
    matcher.each { m ->
        def type = m[1], name = m[2], body = m[3].trim()
        def resolved = null
        if (type == 'String') {
            def literal = body =~ /^"((?:[^"\\]|\\.)*)"$/
            if (literal.matches()) {
                resolved = literal[0][1]
            } else if (consts.containsKey(body)) {
                resolved = consts[body]
            }
        } else {
            def b64 = body =~ /Base64\.decode\(\s*(\w+)\s*,/
            if (b64.find() && consts.containsKey(b64.group(1))) {
                resolved = consts[b64.group(1)]
            }
        }
        if (resolved == null) {
            throw new GradleException("解析不了 ${f} 里的 ${name}()，请保持模板里的写法（返回字面量，或返回本文件的 private static final String 常量）")
        }
        values[name] = [type: type, value: resolved.toString()]
    }
    if (values.isEmpty()) {
        // 空文件（0 字节 / 只有注释）= 没配置，跳过；有内容却解析不出东西才报错
        def stripped = src.replaceAll('(?s)/\\*.*?\\*/', '').replaceAll('(?m)^\\s*//.*$', '').trim()
        if (!stripped.isEmpty()) {
            throw new GradleException("${f} 里没解析到配置项，请从模板复制后修改（保持 public static getXxx() { return ...; } 的写法）")
        }
    }
    values
}

// 逐条合并：private > default > template，空字符串视为「没配」
def secretMerged = [:]
def secretPickedFrom = [:]
secretStages.each { stage ->
    if (!stage.file.exists()) return
    def parsed = parseSecretSource(stage.file)
    parsed.each { name, entry ->
        def already = secretMerged[name]
        if (already == null) {
            // 先登记类型（取第一个有该条目的文件）
            secretMerged[name] = [type: entry.type, value: '']
        }
        if (secretMerged[name].value.isEmpty() && entry.value != '') {
            secretMerged[name] = [type: entry.type, value: entry.value]
            secretPickedFrom[name] = stage.name
        }
    }
}
if (!secretMerged.containsKey('getVerifyKey')) {
    throw new GradleException('三份配置里都没有 getVerifyKey()，至少 template/Secret.java 必须有')
}

def secretGenFile = layout.buildDirectory.file('generated/source/secret/com/xero/ca/gen/Secret.java')

tasks.register('generateSecret') {
    def stages = secretStages.collect { it.file }
    inputs.files(stages.findAll { it.exists() })
    outputs.file(secretGenFile)
    doLast {
        def out = secretGenFile.get().asFile
        out.parentFile.mkdirs()
        def sb = new StringBuilder()
        sb << 'package com.xero.ca.gen;\n\n'
        sb << 'import android.util.Base64;\n\n'
        sb << '/**\n'
        sb << ' * 由 app/secret-config.gradle 在构建时生成，不要手改。\n'
        sb << ' * 逐条合并 local（本机） > standard（默认） > template（模板），空条目自动回退。\n'
        sb << ' */\n'
        sb << 'public class Secret {\n'
        secretMerged.each { name, entry ->
            def from = secretPickedFrom[name] ?: 'template（模板，空实现）'
            sb << "    // ${name} 来自 ${from}\n"
            if (entry.type == 'String') {
                sb << "    public static String ${name}() {\n        return \"${entry.value}\";\n    }\n\n"
            } else {
                sb << "    public static byte[] ${name}() {\n        return Base64.decode(\"${entry.value}\", Base64.DEFAULT);\n    }\n\n"
            }
        }
        // 去掉最后一个多余的空行
        def text = sb.toString().replaceAll(/\n+\$/, '\n')
        out.text = text + '}\n'
        logger.lifecycle('Secret 配置（逐条合并）:')
        secretMerged.keySet().sort().each { name ->
            def from = secretPickedFrom[name] ?: 'template（空）'
            def shown = secretMerged[name].value.isEmpty() ? '（空）' : '（已配置）'
            logger.lifecycle("  ${name}: ${from} ${shown}")
        }
        logger.lifecycle('  生成: ' + out)
    }
}

preBuild.dependsOn 'generateSecret'
