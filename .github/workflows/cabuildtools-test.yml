name: cabuildtools test

on:
  push:
    paths:
      - "ca/cabuildtools/**"
      - ".github/workflows/cabuildtools-test.yml"
  pull_request:
    paths:
      - "ca/cabuildtools/**"
      - ".github/workflows/cabuildtools-test.yml"
  workflow_dispatch:

jobs:
  test:
    name: loader-ast / async-transform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ca/cabuildtools
        run: npm install --no-audit --no-fund

        # ca/cabuildtools（来自 CA 仓库）的 package.json 还是上游的占位 test 脚本，
        # 这两套测试都是独立 node 脚本，直接跑；等 CA 仓库补上 npm test 后可改回 npm test
      - name: Run tests
        working-directory: ca/cabuildtools
        run: |
          node tests/async-transform.test.js
          node tests/loader-ast.test.js
